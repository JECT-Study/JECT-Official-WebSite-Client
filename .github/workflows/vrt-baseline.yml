name: Visual Regression Baseline (BackstopJS)

on:
  # vrt-baseline 레이블을 붙일 때만 baseline을 재생성한다.
  pull_request:
    types:
      - labeled

jobs:
  baseline:
    if: github.event.label.name == 'vrt-baseline'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # 같은 PR에서 레이블을 연달아 붙이면 이전 실행을 취소한다.
    concurrency:
      group: vrt-baseline-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      # baseline 커밋을 PR 브랜치에 푸시해야 하므로 head 브랜치를 체크아웃하고 자격 증명을 유지한다.
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm --workspace @jects/vrt run sb:build

      # 로컬과 동일한 Docker 이미지로 baseline을 재생성한다.
      # ref:run이 bitmaps_reference를 먼저 비우므로 삭제된 스토리의 남은 스냅샷은 제거된다.
      - name: Regenerate baseline
        run: npm --workspace @jects/vrt run vrt:reference
        env:
          CI: "true"

      - name: Commit and push baseline
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A packages/vrt/backstop_data/bitmaps_reference
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "baseline에 변경 사항이 없습니다."
          else
            git commit -m "chore(vrt): CI에서 baseline 재생성"
            git push origin HEAD:${{ github.head_ref }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment result
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const changed = '${{ steps.commit.outputs.changed }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let body;
            if (changed === 'true') {
              body = `## 🖼️ VRT baseline 재생성 완료\n\n- 삭제된 스토리의 스냅샷을 정리하고 현재 스토리 기준으로 baseline을 새로 커밋했습니다.\n- 워크플로: [실행 내역 보기](${runUrl})`;
            } else if (changed === 'false') {
              body = `## 🖼️ VRT baseline 재생성 완료\n\n- baseline에 변경 사항이 없어 커밋하지 않았습니다.\n- 워크플로: [실행 내역 보기](${runUrl})`;
            } else {
              body = `## ❌ VRT baseline 재생성 실패\n\n- 워크플로 실행 내역을 확인해 주세요.\n- 워크플로: [실행 내역 보기](${runUrl})`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });

      - name: Remove vrt-baseline label
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: 'vrt-baseline',
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

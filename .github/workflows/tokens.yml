name: Token Build

on:
  pull_request:
    paths:
      - "packages/jds/src/tokens/input/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build Tokens
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Tokens
        run: npm run build:tokens --workspace=@jects/jds

      - name: Detect generated changes
        id: generated
        run: |
          if git diff --quiet -- packages/jds/src/tokens; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update changeset
        env:
          BASE_REF: ${{ github.base_ref }}
          CHANGESET: .changeset/figma-token-sync-${{ github.event.pull_request.number }}.md
          FORCE: ${{ steps.generated.outputs.changed == 'true' && '--force' || '' }}
        run: |
          MERGE_BASE="$(git merge-base "origin/${BASE_REF}" HEAD)"
          node packages/jds/scripts/token-contract-diff.mjs \
            --base "${MERGE_BASE}" \
            --changeset "${CHANGESET}" \
            --comment "${RUNNER_TEMP}/token-contract-diff.md" \
            ${FORCE}

      - name: Detect changes
        id: changes
        run: |
          git add --intent-to-add .changeset
          if git diff --quiet -- packages/jds/src/tokens .changeset; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "토큰 생성물과 체인지셋에 변경 사항이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packages/jds/src/tokens .changeset
          fi

      - name: Create App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TOKEN_BUILD_APP_ID }}
          private-key: ${{ secrets.TOKEN_BUILD_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"
          git add packages/jds/src/tokens .changeset
          git commit --no-verify -m "chore(tokens): 토큰 생성물과 체인지셋 갱신"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

      - name: Comment contract diff
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- token-contract-diff -->";
            const commentPath = `${process.env.RUNNER_TEMP}/token-contract-diff.md`;

            if (!fs.existsSync(commentPath)) return;

            const body = fs.readFileSync(commentPath, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

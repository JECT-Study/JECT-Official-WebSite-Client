name: Token Build

on:
  pull_request:
    paths:
      - "packages/jds/src/tokens/input/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Tokens
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Tokens
        run: npm run build:tokens --workspace=@jects/jds

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- packages/jds/src/tokens)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "토큰 생성물에 변경 사항이 없습니다."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short -- packages/jds/src/tokens
          fi

      - name: Create App token
        if: steps.changes.outputs.changed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TOKEN_BUILD_APP_ID }}
          private-key: ${{ secrets.TOKEN_BUILD_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"
          git add packages/jds/src/tokens
          git commit --no-verify -m "chore(tokens): 토큰 생성물 갱신"
          git push --no-verify "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"

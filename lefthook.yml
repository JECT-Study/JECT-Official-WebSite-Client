# 커밋 전 스테이지된 파일에만 포맷과 린트를 적용한다.
# 우회가 필요하면 git commit --no-verify, 임시 비활성화는 LEFTHOOK=0.

# GUI 클라이언트는 .zshrc를 읽지 않아 nvm의 node가 PATH에 없다. rc에서 채운다.
rc: .lefthookrc

pre-commit:
  # 충돌 난 머지를 마무리하는 커밋은 머지가 가져온 파일 전체가 스테이지되므로 건너뛴다.
  skip:
    - merge
  # prettier가 파일을 고친 뒤 eslint가 읽어야 하므로 순차 실행한다.
  parallel: false
  jobs:
    - name: prettier
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

    # eslint는 flat config를 CWD에서 찾으므로 워크스페이스별로 실행한다.
    - name: eslint-web
      root: apps/web/
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true

    - name: eslint-jds
      root: packages/jds/
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --fix --max-warnings 0 --no-warn-ignored {staged_files}
      stage_fixed: true
